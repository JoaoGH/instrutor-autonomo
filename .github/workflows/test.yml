name: Automated Tests & CI Pipeline

on:
  push:
    branches: [ "main" ]
    branches-ignore: []
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Executar Suíte de Testes Automatizados
        run: npm test

      - name: Validar Build de Produção
        run: npm run build
